<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<title>미스터 에그 - 속임수 게임</title>
<style>
  :root {
    --bg-1: #ffffff;
    --bg-2: #f5f3fb;
    --floor: #e6e1f0;
    --wall: #d6cee6;
    --fg: #1a1530;
    --fg-muted: #5e5878;
    --accent: #ffb84d;
    --accent2: #ff6b9d;
    --door: #8a5530;
    --door-frame: #6b3f1d;
    --shadow: rgba(40, 20, 80, 0.12);

    /* scale factor — landscape sizes scale with min(viewport) */
    --u: 1vmin;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg-1);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
  }
  #app {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
  }

  /* Portrait blocker — game is landscape-only */
  .orient-warn {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--bg-1);
    z-index: 100;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .orient-warn .phone {
    width: 80px;
    height: 140px;
    border: 4px solid var(--accent);
    border-radius: 16px;
    position: relative;
    margin-bottom: 24px;
    animation: rotatePhone 1.6s ease-in-out infinite;
  }
  .orient-warn .phone::before {
    content: "";
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 24px;
    height: 4px;
    background: var(--accent);
    border-radius: 2px;
  }
  @keyframes rotatePhone {
    0%, 30% { transform: rotate(0deg); }
    60%, 100% { transform: rotate(-90deg); }
  }
  .orient-warn .msg {
    font-size: 18px;
    font-weight: 700;
    color: var(--fg);
    margin-bottom: 4px;
  }
  .orient-warn .sub {
    font-size: 13px;
    opacity: 0.7;
    line-height: 1.5;
  }
  /* Portrait detection is done in JS by comparing innerWidth vs innerHeight,
     because some mobile browsers misreport CSS orientation after rotation. */
  body.is-portrait .orient-warn { display: flex; }
  body.is-portrait #app { display: none; }

  /* HUD */
  .hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: calc(var(--u) * 1.5) calc(var(--u) * 3);
    font-size: calc(var(--u) * 2.2);
    z-index: 10;
  }
  .hud .level {
    background: rgba(40, 20, 80, 0.08);
    color: var(--fg);
    padding: calc(var(--u) * 0.8) calc(var(--u) * 2);
    border-radius: 999px;
    backdrop-filter: blur(8px);
    font-weight: 600;
  }
  .hud .hint-btn {
    background: var(--accent);
    color: #1a1530;
    border: none;
    padding: calc(var(--u) * 0.8) calc(var(--u) * 2.4);
    border-radius: 999px;
    font-weight: 700;
    font-size: calc(var(--u) * 2);
    cursor: pointer;
  }
  .hud .hint-btn:active { transform: scale(0.95); }

  /* Stage */
  .stage {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: linear-gradient(180deg, var(--bg-2) 0%, var(--bg-1) 100%);
  }
  .room { position: absolute; inset: 0; }
  .floor {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 18%;
    background: linear-gradient(180deg, var(--floor) 0%, #2a1a3e 100%);
    border-top: 2px solid rgba(255, 255, 255, 0.08);
  }

  /* Egg character (scales with vmin) */
  .egg {
    --egg-w: calc(var(--u) * 9);
    --egg-h: calc(var(--u) * 11);
    position: absolute;
    width: var(--egg-w);
    height: var(--egg-h);
    bottom: calc(18% - var(--u) * 1.2);
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    transition: left 0.45s cubic-bezier(0.34, 1.56, 0.64, 1), bottom 0.4s ease-out, opacity 0.3s;
    pointer-events: none;
  }
  .egg .body {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 30% 30%, #fffbe6 0%, #fff0c2 60%, #f5d97a 100%);
    border-radius: 50% 50% 45% 45% / 60% 60% 40% 40%;
    box-shadow: inset -6px -8px 18px rgba(180, 130, 0, 0.25), 0 6px 14px var(--shadow);
  }
  .egg .face {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-top: calc(var(--u) * 1.5);
  }
  .egg .eyes { display: flex; gap: calc(var(--u) * 1.4); }
  .egg .eye {
    width: calc(var(--u) * 1.1);
    height: calc(var(--u) * 1.4);
    background: #2a1a3e;
    border-radius: 50%;
    animation: blink 4s infinite;
  }
  .egg .mouth {
    margin-top: calc(var(--u) * 0.8);
    width: calc(var(--u) * 1.6);
    height: calc(var(--u) * 0.8);
    border: 2px solid #2a1a3e;
    border-top: none;
    border-radius: 0 0 12px 12px;
  }
  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(1); }
    94%, 98% { transform: scaleY(0.1); }
  }
  .egg.celebrate { animation: hop 0.5s ease-in-out 2; }
  @keyframes hop {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(calc(var(--u) * -4)); }
  }

  /* Door — sized in vmin */
  .door {
    --door-w: calc(var(--u) * 11);
    --door-h: calc(var(--u) * 19);
    position: absolute;
    width: var(--door-w);
    height: var(--door-h);
    background: linear-gradient(180deg, var(--door) 0%, #4a2810 100%);
    border: 4px solid var(--door-frame);
    border-radius: calc(var(--u) * 5.5) calc(var(--u) * 5.5) 6px 6px;
    box-shadow: 0 6px 16px var(--shadow), inset 0 0 20px rgba(0, 0, 0, 0.3);
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s, opacity 0.4s;
  }
  .door:active { transform: scale(0.97); }
  .door .knob {
    position: absolute;
    width: calc(var(--u) * 1.1);
    height: calc(var(--u) * 1.1);
    background: var(--accent);
    border-radius: 50%;
    right: calc(var(--u) * 1.4);
    top: 50%;
    transform: translateY(-50%);
    box-shadow: 0 0 6px var(--accent);
  }
  .door .lock {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    font-size: calc(var(--u) * 3);
  }
  .door:not(.locked) .lock { display: none; }
  .door.flash {
    box-shadow: 0 0 0 4px var(--accent), 0 0 32px var(--accent), inset 0 0 20px rgba(0, 0, 0, 0.3);
  }
  .door.open {
    background: #0a0512;
    border-color: var(--door-frame);
  }

  /* Key */
  .key {
    position: absolute;
    width: calc(var(--u) * 7);
    height: calc(var(--u) * 3.5);
    cursor: grab;
    z-index: 6;
    touch-action: none;
    transition: filter 0.2s;
  }
  .key.dragging { cursor: grabbing; filter: drop-shadow(0 8px 12px rgba(255, 211, 77, 0.5)); }
  .key svg { width: 100%; height: 100%; display: block; }

  /* Movement controls (bottom-left) */
  .controls {
    position: absolute;
    left: calc(var(--u) * 2.5);
    bottom: calc(var(--u) * 2.5);
    display: flex;
    gap: calc(var(--u) * 1.5);
    z-index: 15;
  }
  .ctrl-btn {
    width: calc(var(--u) * 9);
    height: calc(var(--u) * 9);
    border-radius: 50%;
    background: rgba(40, 20, 80, 0.08);
    border: 2px solid rgba(40, 20, 80, 0.18);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--fg);
    padding: 0;
    transition: transform 0.1s, background 0.1s;
  }
  .ctrl-btn:active {
    transform: scale(0.9);
    background: var(--accent);
    color: #1a1530;
  }
  .ctrl-btn svg {
    width: 55%;
    height: 55%;
    fill: currentColor;
  }

  /* Speech */
  .speech {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(18% + var(--u) * 12);
    background: #1a1530;
    color: #ffffff;
    padding: calc(var(--u) * 1.2) calc(var(--u) * 2);
    border-radius: 16px;
    font-size: calc(var(--u) * 2);
    font-weight: 500;
    max-width: 60%;
    text-align: center;
    box-shadow: 0 4px 12px var(--shadow);
    z-index: 7;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
    white-space: nowrap;
  }
  .speech::after {
    content: "";
    position: absolute;
    bottom: calc(var(--u) * -0.6);
    left: 50%;
    transform: translateX(-50%) rotate(45deg);
    width: calc(var(--u) * 1.2);
    height: calc(var(--u) * 1.2);
    background: #1a1530;
  }
  .speech.show { opacity: 1; }

  /* Title screen */
  .title-screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, var(--bg-2) 0%, var(--bg-1) 100%);
    z-index: 20;
    transition: opacity 0.5s;
  }
  .title-screen.hide { opacity: 0; pointer-events: none; }
  .title-screen .logo {
    font-size: calc(var(--u) * 7);
    font-weight: 800;
    letter-spacing: -0.03em;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: calc(var(--u) * 0.5);
  }
  .title-screen .sub {
    font-size: calc(var(--u) * 2.4);
    opacity: 0.7;
    margin-bottom: calc(var(--u) * 5);
  }
  .title-screen .start-btn {
    background: var(--accent);
    color: #1a1530;
    border: none;
    padding: calc(var(--u) * 2) calc(var(--u) * 5);
    border-radius: 999px;
    font-size: calc(var(--u) * 2.8);
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(255, 211, 77, 0.4);
  }
  .title-screen .start-btn:active { transform: scale(0.97); }
  .title-screen .egg-preview {
    width: calc(var(--u) * 11);
    height: calc(var(--u) * 14);
    margin-bottom: calc(var(--u) * 3);
    position: relative;
  }
  .title-screen .egg-preview .body {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 30% 30%, #fffbe6 0%, #fff0c2 60%, #f5d97a 100%);
    border-radius: 50% 50% 45% 45% / 60% 60% 40% 40%;
    box-shadow: inset -6px -8px 18px rgba(180, 130, 0, 0.25), 0 6px 14px var(--shadow);
    animation: bob 2s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(calc(var(--u) * -1.5)); }
  }

  /* Level transition */
  .transition {
    position: absolute;
    inset: 0;
    background: var(--bg-1);
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s;
  }
  .transition.show { opacity: 1; pointer-events: all; }
  .transition .text {
    font-size: calc(var(--u) * 5);
    font-weight: 700;
    color: var(--fg);
  }
</style>
</head>
<body>

<!-- Portrait orientation blocker -->
<div class="orient-warn" aria-hidden="true">
  <div class="phone"></div>
  <div class="msg">가로로 돌려줘</div>
  <div class="sub">이 게임은 가로 모드 전용이야</div>
</div>

<div id="app">
  <div class="hud" hidden>
    <div class="level" id="levelLabel">LEVEL 1</div>
    <button class="hint-btn" id="hintBtn">힌트</button>
  </div>

  <div class="stage" id="stage">
    <div class="title-screen" id="titleScreen">
      <div class="egg-preview"><div class="body"></div></div>
      <div class="logo">미스터 에그</div>
      <div class="sub">속임수에 당하지 말 것</div>
      <button class="start-btn" id="startBtn">시작</button>
    </div>

    <div class="transition" id="transition">
      <div class="text" id="transitionText">LEVEL 1</div>
    </div>

    <div class="room" id="room" hidden>
      <div class="floor"></div>
      <div class="egg" id="egg">
        <div class="body"></div>
        <div class="face">
          <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
          <div class="mouth"></div>
        </div>
      </div>
      <div class="speech" id="speech"></div>

      <div class="controls" id="controls" hidden>
        <button class="ctrl-btn" id="btnLeft" aria-label="왼쪽">
          <svg viewBox="0 0 24 24"><path d="M15.4 17.6 9.8 12l5.6-5.6L14 5l-7 7 7 7z"/></svg>
        </button>
        <button class="ctrl-btn" id="btnRight" aria-label="오른쪽">
          <svg viewBox="0 0 24 24"><path d="M8.6 6.4 14.2 12l-5.6 5.6L10 19l7-7-7-7z"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";

  const $ = (id) => document.getElementById(id);
  const stage = $("stage");
  const room = $("room");
  const egg = $("egg");
  const speech = $("speech");
  const hud = document.querySelector(".hud");
  const levelLabel = $("levelLabel");
  const transition = $("transition");
  const transitionText = $("transitionText");

  let currentLevel = 0;
  let levelEls = [];
  let cleanupFns = [];
  let eggX = 50; // egg horizontal position in %

  const say = (text, ms = 1800) => {
    speech.textContent = text;
    speech.classList.add("show");
    clearTimeout(say._t);
    if (ms) say._t = setTimeout(() => speech.classList.remove("show"), ms);
  };

  const addEl = (html) => {
    const tpl = document.createElement("template");
    tpl.innerHTML = html.trim();
    const el = tpl.content.firstChild;
    room.appendChild(el);
    levelEls.push(el);
    return el;
  };

  const onCleanup = (fn) => cleanupFns.push(fn);

  const clearLevel = () => {
    levelEls.forEach((el) => el.remove());
    levelEls = [];
    cleanupFns.forEach((fn) => fn());
    cleanupFns = [];
    speech.classList.remove("show");
  };

  const moveEggTo = (xPercent) => {
    eggX = Math.max(4, Math.min(96, xPercent));
    egg.style.left = eggX + "%";
  };
  const nudgeEgg = (delta) => moveEggTo(eggX + delta);

  const nextLevel = () => {
    currentLevel++;
    if (currentLevel >= LEVELS.length) {
      showEnding();
      return;
    }
    showTransition("LEVEL " + (currentLevel + 1), () => loadLevel(currentLevel));
  };

  const showTransition = (text, after) => {
    transitionText.textContent = text;
    transition.classList.add("show");
    setTimeout(() => {
      clearLevel();
      after && after();
      setTimeout(() => transition.classList.remove("show"), 400);
    }, 600);
  };

  const showEnding = () => {
    transitionText.textContent = "🎉 클리어!";
    transition.classList.add("show");
    clearLevel();
  };

  const eggEntersDoor = (doorEl, after) => {
    const dr = doorEl.getBoundingClientRect();
    const sr = stage.getBoundingClientRect();
    const xp = ((dr.left + dr.width / 2 - sr.left) / sr.width) * 100;
    moveEggTo(xp);
    setTimeout(() => {
      egg.style.opacity = "0";
      setTimeout(() => {
        egg.style.opacity = "1";
        after && after();
      }, 400);
    }, 600);
  };

  const loadLevel = (idx) => {
    levelLabel.textContent = "LEVEL " + (idx + 1);
    moveEggTo(50);
    LEVELS[idx].init();
  };

  // ===== Level 1: 숨은 열쇠를 드래그해서 자물쇠에 =====
  const level1 = {
    init() {
      // landscape: door on the left, key on the right
      const door = addEl(`
        <div class="door locked" style="left:18%;bottom:calc(18% + var(--u) * 1);position:absolute;">
          <div class="knob"></div>
          <div class="lock">🔒</div>
        </div>
      `);
      const key = addEl(`
        <div class="key" style="right:8%;top:25%;transform:rotate(15deg);">
          <svg viewBox="0 0 48 24" xmlns="http://www.w3.org/2000/svg">
            <circle cx="10" cy="12" r="8" fill="#ffd34d" stroke="#a87a00" stroke-width="2"/>
            <circle cx="10" cy="12" r="3" fill="#1a1530"/>
            <rect x="16" y="9" width="28" height="6" rx="2" fill="#ffd34d" stroke="#a87a00" stroke-width="2"/>
            <rect x="36" y="9" width="3" height="10" fill="#a87a00"/>
            <rect x="42" y="9" width="3" height="8" fill="#a87a00"/>
          </svg>
        </div>
      `);
      moveEggTo(50);
      setTimeout(() => say("열쇠가 어디 있을까?"), 400);

      let dragging = false;
      let offsetX = 0, offsetY = 0;
      const onDown = (e) => {
        e.preventDefault();
        const t = e.touches ? e.touches[0] : e;
        const r = key.getBoundingClientRect();
        offsetX = t.clientX - r.left;
        offsetY = t.clientY - r.top;
        dragging = true;
        key.classList.add("dragging");
        key.style.transition = "none";
      };
      const onMove = (e) => {
        if (!dragging) return;
        e.preventDefault();
        const t = e.touches ? e.touches[0] : e;
        const sr = stage.getBoundingClientRect();
        const x = t.clientX - sr.left - offsetX;
        const y = t.clientY - sr.top - offsetY;
        key.style.left = x + "px";
        key.style.top = y + "px";
        key.style.right = "auto";
        key.style.transform = "rotate(0deg)";
      };
      const onUp = () => {
        if (!dragging) return;
        dragging = false;
        key.classList.remove("dragging");
        const k = key.getBoundingClientRect();
        const d = door.getBoundingClientRect();
        const overlap = !(k.right < d.left || k.left > d.right || k.bottom < d.top || k.top > d.bottom);
        if (overlap) unlock();
        else say("문에 갖다 대 봐!");
      };
      const unlock = () => {
        door.classList.remove("locked");
        door.classList.add("open", "flash");
        key.style.transition = "opacity 0.3s";
        key.style.opacity = "0";
        say("문이 열렸어!", 1200);
        setTimeout(() => eggEntersDoor(door, nextLevel), 1000);
      };

      key.addEventListener("touchstart", onDown, { passive: false });
      key.addEventListener("mousedown", onDown);
      window.addEventListener("touchmove", onMove, { passive: false });
      window.addEventListener("mousemove", onMove);
      window.addEventListener("touchend", onUp);
      window.addEventListener("mouseup", onUp);
      onCleanup(() => {
        key.removeEventListener("touchstart", onDown);
        key.removeEventListener("mousedown", onDown);
        window.removeEventListener("touchmove", onMove);
        window.removeEventListener("mousemove", onMove);
        window.removeEventListener("touchend", onUp);
        window.removeEventListener("mouseup", onUp);
      });
    },
    hint: "노란 열쇠를 손가락으로 끌어다 문 위에 놓아봐.",
  };

  // ===== Level 2: 깜빡인 진짜 문 기억 (가로 5문) =====
  const level2 = {
    init() {
      // landscape: spread 5 doors horizontally
      const positions = [12, 30, 50, 70, 88];
      const doors = positions.map((p) =>
        addEl(`
          <div class="door" style="left:${p}%;transform:translateX(-50%);bottom:calc(18% + var(--u) * 1);position:absolute;">
            <div class="knob"></div>
          </div>
        `)
      );
      const winnerIdx = Math.floor(Math.random() * doors.length);
      say("어느 문이 진짜일까? 잘 봐!", 1500);
      setTimeout(() => {
        doors[winnerIdx].classList.add("flash");
        setTimeout(() => doors[winnerIdx].classList.remove("flash"), 800);
      }, 1600);
      let locked = false;
      doors.forEach((d, i) => {
        const onTap = () => {
          if (locked) return;
          if (i === winnerIdx) {
            locked = true;
            d.classList.add("open", "flash");
            say("정답!", 1000);
            setTimeout(() => eggEntersDoor(d, nextLevel), 700);
          } else {
            d.classList.add("locked");
            const lockIcon = document.createElement("div");
            lockIcon.className = "lock";
            lockIcon.textContent = "🔒";
            d.appendChild(lockIcon);
            say("어이쿠, 다시!");
            setTimeout(() => {
              doors[winnerIdx].classList.add("flash");
              setTimeout(() => doors[winnerIdx].classList.remove("flash"), 600);
            }, 600);
            setTimeout(() => { d.classList.remove("locked"); lockIcon.remove(); }, 1000);
          }
        };
        d.addEventListener("click", onTap);
        onCleanup(() => d.removeEventListener("click", onTap));
      });
    },
    hint: "처음에 노란 빛이 깜빡인 문을 누르면 돼.",
  };

  const LEVELS = [level1, level2];

  $("startBtn").addEventListener("click", () => {
    $("titleScreen").classList.add("hide");
    hud.hidden = false;
    room.hidden = false;
    $("controls").hidden = false;
    currentLevel = 0;
    loadLevel(0);
  });

  // Hold-to-move: while a direction button is pressed, move the egg 1% per frame.
  let holdDir = 0;
  let holdRAF = 0;
  let prevTransition = "";
  const tick = () => {
    if (!holdDir) return;
    nudgeEgg(holdDir);
    holdRAF = requestAnimationFrame(tick);
  };
  const startHold = (dir) => {
    if (holdDir === dir) return;
    holdDir = dir;
    prevTransition = egg.style.transition;
    egg.style.transition = "none";
    cancelAnimationFrame(holdRAF);
    tick();
  };
  const stopHold = () => {
    if (!holdDir) return;
    holdDir = 0;
    cancelAnimationFrame(holdRAF);
    holdRAF = 0;
    egg.style.transition = prevTransition;
  };
  const bindHold = (btn, dir) => {
    const down = (e) => { e.preventDefault(); startHold(dir); };
    btn.addEventListener("pointerdown", down);
  };
  bindHold($("btnLeft"), -1);
  bindHold($("btnRight"), 1);
  // Release globally so the egg always stops when the finger lifts,
  // even if it slid off the button or out of the window.
  window.addEventListener("pointerup", stopHold);
  window.addEventListener("pointercancel", stopHold);
  window.addEventListener("blur", stopHold);

  $("hintBtn").addEventListener("click", () => {
    const lv = LEVELS[currentLevel];
    if (lv && lv.hint) say(lv.hint, 2500);
  });

  document.addEventListener("gesturestart", (e) => e.preventDefault());

  // Try to lock orientation if supported (fullscreen / PWA only)
  if (screen.orientation && screen.orientation.lock) {
    screen.orientation.lock("landscape").catch(() => {});
  }

  // Detect orientation by viewport size, not CSS media query — more reliable
  // across mobile browsers (esp. iOS Safari with address-bar reflow).
  const checkOrientation = () => {
    const isPortrait = window.innerWidth < window.innerHeight;
    document.body.classList.toggle("is-portrait", isPortrait);
  };
  checkOrientation();
  window.addEventListener("resize", checkOrientation);
  window.addEventListener("orientationchange", () => {
    // give the browser a beat to settle viewport dimensions
    setTimeout(checkOrientation, 100);
    setTimeout(checkOrientation, 400);
  });
})();
</script>
</body>
</html>
