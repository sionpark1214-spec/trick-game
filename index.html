<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0f1020" />
<title>속임수 게임</title>
<style>
  :root {
    --bg: #0f1020;
    --fg: #f5f6ff;
    --accent: #ff5a8a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
      "Pretendard", "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
    text-align: center;
  }
  main { padding: 24px; max-width: 480px; }
  h1 { font-size: 28px; margin: 0 0 12px; letter-spacing: -0.02em; }
  p { opacity: 0.8; line-height: 1.6; margin: 8px 0; }
  .badge {
    display: inline-block;
    margin-top: 16px;
    padding: 8px 14px;
    border: 1px solid var(--accent);
    border-radius: 999px;
    color: var(--accent);
    font-size: 13px;
  }
</style>
</head>
<body>
  <main>
    <h1>속임수 게임</h1>
    <p>모바일 웹게임 준비 중이야.</p>
    <p>여기는 GitHub Pages로 배포된 placeholder.</p>
    <span class="badge">coming soon</span>
  </main>
</body>
</html>
